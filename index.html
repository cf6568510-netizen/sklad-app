<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14251e"><title>Склад Pro</title>
<style>
:root{--ink:#17231e;--muted:#708078;--bg:#f3f5f2;--card:#fff;--line:#e3e8e4;--green:#176b4a;--green2:#dff2e8;--red:#b23b3b;--nav:#14251e}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:flex;min-height:100vh}.side{width:260px;background:var(--nav);color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:20}.brand{display:flex;align-items:center;gap:11px;padding:5px 10px 22px;font-size:20px;font-weight:800}.brandmark{width:34px;height:34px;border-radius:10px;background:#36a775;display:grid;place-items:center}.navgroup{font-size:10px;letter-spacing:.12em;color:#82978d;text-transform:uppercase;padding:17px 12px 7px}.nav button{width:100%;border:0;background:none;color:#cbd6d0;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#244036;color:#fff}.main{margin-left:260px;width:calc(100% - 260px);padding:28px 32px 60px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.eyebrow{color:var(--green);font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.title{font-size:29px;font-weight:800;margin-top:3px}.subtitle{color:var(--muted);font-size:13px;margin-top:5px}.topactions,.actions,.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:#fff;cursor:pointer;font-weight:650}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost{background:var(--green2);color:var(--green)}.mobilebtn{display:none}.select,.input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;min-height:40px;color:var(--ink)}.input{min-width:170px}.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #1a2e2410}.label{font-size:12px;color:var(--muted)}.metric{font-size:28px;font-weight:800;margin:8px 0 2px}.delta{font-size:12px;color:var(--green)}.split{grid-template-columns:1.35fr .65fr}.split2{grid-template-columns:1fr 1fr}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.sectionhead h3{margin:0;font-size:17px}.tablewrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:720px}.table th,.table td{padding:12px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.product{display:flex;align-items:center;gap:10px}.thumb{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#e9edea,#cfd9d3);display:grid;place-items:center;font-weight:800;color:#617169}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;background:var(--green2);color:var(--green);font-size:11px;font-weight:700}.badge.warn{background:#fff1d8;color:#966312}.badge.blue{background:#e5eefb;color:#315d9c}.badge.gray{background:#edf0ee;color:#637068}.link{border:0;background:none;color:var(--green);cursor:pointer;padding:0;font-weight:700}.bar{height:7px;background:#edf0ee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}.chart{height:170px;display:flex;align-items:flex-end;gap:9px;padding-top:18px}.chart span{flex:1;background:linear-gradient(#36a775,#176b4a);border-radius:7px 7px 2px 2px;min-width:18px;position:relative}.chart span:after{content:attr(data-v);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}.notice{padding:13px 14px;border-radius:10px;background:#fff8e9;color:#795413;font-size:13px;margin-bottom:14px}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:700}.field .input,.field .select{width:100%;min-width:0}.span2{grid-column:span 2}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:8px}.tabs button.active{background:var(--nav);color:#fff}.progress{display:flex;overflow:auto;margin:15px 0}.step{min-width:120px;padding:10px;border-bottom:3px solid var(--line);color:var(--muted);font-size:11px}.step.done{border-color:var(--green);color:var(--green);font-weight:700}.detailhero{display:flex;gap:20px;align-items:center}.photo{width:120px;height:120px;border-radius:16px;background:linear-gradient(135deg,#d9e2dd,#8ea499);display:grid;place-items:center;color:#fff;font-size:32px;font-weight:800}.drawerShade{display:none;position:fixed;inset:0;background:#0008;z-index:19}.toast{position:fixed;right:24px;bottom:24px;background:#14251e;color:white;padding:13px 17px;border-radius:10px;display:none;z-index:50}.toast.show{display:block}.muted{color:var(--muted)}.mt{margin-top:16px}h3{margin-top:0}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.split,.split2{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.drawerShade.show{display:block}.main{margin:0;width:100%;padding:18px 14px 45px}.mobilebtn{display:inline-flex}.title{font-size:24px}.kpis{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px}.metric{font-size:23px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.topactions .select{max-width:155px}}
</style></head><body><div class="app"><div class="drawerShade" id="shade" onclick="toggleMenu(false)"></div><aside class="side" id="side"><div class="brand"><span class="brandmark">S</span>Склад Pro</div><nav class="nav"><div class="navgroup">Обзор</div><button class="active" data-page="dashboard">Главная</button><button data-page="products">Товары</button><button data-page="catalog">Каталог</button><div class="navgroup">Операции</div><button data-page="income">Приход</button><button data-page="expense">Расход</button><button data-page="orders">Заказы производителю</button><button data-page="suppliers">Поставщики</button><div class="navgroup">Управление</div><button data-page="reports">Отчёты</button><button data-page="analytics">Аналитика</button><button data-page="users">Пользователи</button><button data-page="settings">Настройки</button></nav></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Управление запасами</div><div class="title" id="pageTitle">Главная</div><div class="subtitle" id="pageSub"></div></div><div class="topactions"><button class="btn secondary mobilebtn" onclick="toggleMenu(true)">☰ Меню</button><select class="select" id="globalWarehouse" onchange="render(currentPage)"><option>Все склады</option><option>Стиль игры</option><option>Лига Легкого Волейбола</option><option>Марбакс</option></select></div></header><div id="content"></div></main></div><div class="toast" id="toast"></div>
<script>
const warehouses=['Стиль игры','Лига Легкого Волейбола','Марбакс'],sizes=['S – 46','M – 48','L – 50','XL – 52'];let products=[{id:1,name:'Куртка игровая Pro',sku:'JKT-104',category:'Куртки',brand:'Volley Pro',color:'Чёрный',size:'M – 48',price:8900,stock:[28,16,9],min:12},{id:2,name:'Худи клубное',sku:'HD-221',category:'Толстовки',brand:'Teamline',color:'Графит',size:'L – 50',price:5900,stock:[14,21,8],min:10},{id:3,name:'Футболка игровая',sku:'TS-008',category:'Футболки',brand:'Volley Pro',color:'Синий',size:'M – 48',price:3200,stock:[35,42,18],min:15},{id:4,name:'Брюки тренировочные',sku:'PT-310',category:'Брюки',brand:'Motion',color:'Чёрный',size:'XL – 52',price:4700,stock:[7,5,4],min:10},{id:5,name:'Шорты спортивные',sku:'SH-117',category:'Шорты',brand:'Motion',color:'Белый',size:'S – 46',price:2700,stock:[24,19,11],min:8}];
const suppliers=[['Фабрика Север','Производитель','5 заказов','1 460 000 ₽','21 день'],['Текстиль Профи','Поставщик','8 заказов','984 000 ₽','12 дней'],['Sport Line Factory','Производитель','3 заказа','2 110 000 ₽','35 дней']],orders=[['ЗП-0028','Фабрика Север','12.08.2026','18.09.2026','684 000 ₽','В производстве'],['ЗП-0027','Sport Line Factory','04.08.2026','10.09.2026','920 000 ₽','Подтверждён'],['ЗП-0026','Текстиль Профи','29.07.2026','20.08.2026','245 000 ₽','Получен']];let currentPage='dashboard';const meta={dashboard:['Главная','Сводная картина по складам'],products:['Товары','Рабочий раздел складских остатков'],catalog:['Каталог','Витрина всего ассортимента'],income:['Приход','Поступление товара на выбранный склад'],expense:['Расход','Списание товаров с разных складов'],orders:['Заказы производителю','Планирование и контроль производства'],suppliers:['Поставщики / Производители','Контрагенты, договоры и поставки'],reports:['Отчёты','Операционные и финансовые показатели'],analytics:['Аналитика','Продажи, оборачиваемость и рекомендации'],users:['Пользователи и права','Роли и доступ к складам'],settings:['Настройки','Справочники и правила учёта'],productCard:['Карточка товара','Подробная информация и остатки'],orderCard:['Заказ производителю','Состав, сроки и история заказа']};
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽',whIndex=()=>warehouses.indexOf(document.getElementById('globalWarehouse').value),qty=p=>whIndex()<0?p.stock.reduce((a,b)=>a+b,0):p.stock[whIndex()],totalQty=()=>products.reduce((a,p)=>a+qty(p),0),card=(l,v,n='')=>`<div class="card"><div class="label">${l}</div><div class="metric">${v}</div><div class="delta">${n}</div></div>`;
function render(page='dashboard'){currentPage=page;document.getElementById('pageTitle').textContent=meta[page][0];document.getElementById('pageSub').textContent=meta[page][1];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML=(window['view_'+page]||(()=>''))();toggleMenu(false)}
function view_dashboard(){let low=products.filter(p=>qty(p)<=p.min);return `<div class="grid kpis">${card('Товарных позиций',products.length,'активный ассортимент')}${card('Остаток, шт.',totalQty(),'+6,4% за месяц')}${card('Стоимость остатков',money(products.reduce((a,p)=>a+qty(p)*p.price,0)),'по текущим ценам')}${card('Низкий остаток',low.length,'требуют внимания')}</div><div class="grid split"><div class="card"><div class="sectionhead"><h3>Остатки по складам</h3><span class="label">в штуках</span></div>${warehouses.map((w,i)=>{let n=products.reduce((a,p)=>a+p.stock[i],0);return `<p><b>${w}</b> <span class="muted">${n} шт.</span></p><div class="bar"><i style="width:${Math.min(n,100)}%"></i></div>`}).join('')}</div><div class="card"><h3>Остатки по размерам</h3>${sizes.map(s=>`<p><span class="badge gray">${s}</span> <b>${products.filter(p=>p.size===s).reduce((a,p)=>a+qty(p),0)} шт.</b></p>`).join('')}</div></div><div class="grid split2 mt"><div class="card"><h3>Последние операции</h3><div class="tablewrap"><table class="table"><tr><th>Операция</th><th>Склад</th><th>Количество</th></tr><tr><td>Приход ПР-0142</td><td>Марбакс</td><td><span class="badge">+42</span></td></tr><tr><td>Расход РС-0318</td><td>Стиль игры</td><td><span class="badge warn">−8</span></td></tr></table></div></div><div class="card"><h3>Товары с низким остатком</h3>${low.length?low.map(p=>`<p><button class="link" onclick="openProduct(${p.id})">${p.name}</button><br><span class="muted">${p.color} · ${p.size}</span><b style="float:right;color:var(--red)">${qty(p)} шт.</b></p>`).join(''):'<p class="muted">Критичных остатков нет</p>'}</div></div>`}
function productRows(readonly=false){return products.map(p=>`<tr><td><div class="product"><span class="thumb">${p.category[0]}</span><div><button class="link" onclick="openProduct(${p.id})">${p.name}</button><br><span class="muted">${p.sku}</span></div></div></td><td>${p.category}</td><td>${p.color}</td><td>${p.size}</td><td>${p.stock.join(' / ')}</td><td><b>${p.stock.reduce((a,b)=>a+b,0)}</b></td>${readonly?'':`<td><button class="btn ghost" onclick="openProduct(${p.id})">Открыть</button></td>`}</tr>`).join('')}
function view_products(){return `<div class="toolbar"><div class="filters"><select class="select"><option>Склад: все</option>${warehouses.map(x=>`<option>${x}</option>`).join('')}</select><select class="select"><option>Категория</option><option>Куртки</option></select><select class="select"><option>Бренд</option><option>Volley Pro</option></select><select class="select"><option>Цвет</option><option>Чёрный</option></select><select class="select"><option>Размер</option>${sizes.map(x=>`<option>${x}</option>`).join('')}</select><select class="select"><option>Наличие / КИЗ</option></select></div><button class="btn" onclick="toast('Форма нового товара подготовлена')">+ Новый товар</button></div><div class="card tablewrap"><table class="table"><tr><th>Товар</th><th>Категория</th><th>Цвет</th><th>Размер</th><th>По складам</th><th>Всего</th><th></th></tr>${productRows()}</table></div>`}
function openProduct(id){window.selectedProduct=id;render('productCard')}function view_productCard(){let p=products.find(x=>x.id==window.selectedProduct)||products[0];return `<button class="btn secondary" onclick="render('products')">← К товарам</button><div class="card mt"><div class="detailhero"><div class="photo">${p.category[0]}</div><div><span class="badge">В наличии</span><h2>${p.name}</h2><div class="muted">${p.sku} · штрихкод 460700${p.id}118 · КИЗ указан</div><p>${p.category} · ${p.brand} · Демисезон · Унисекс · Россия</p><b>${money(p.price)}</b></div></div></div><div class="grid split2 mt"><div class="card"><h3>Цвет × Размер × Остаток</h3><table class="table"><tr><th>Цвет</th><th>Размер</th><th>Остаток</th></tr><tr><td>${p.color}</td><td>${p.size}</td><td><b>${p.stock.reduce((a,b)=>a+b,0)} шт.</b></td></tr><tr><td>${p.color}</td><td>${sizes[(sizes.indexOf(p.size)+1)%4]}</td><td>24 шт.</td></tr></table></div><div class="card"><h3>Распределение по складам</h3>${warehouses.map((w,i)=>`<p>${w}<b style="float:right">${p.stock[i]} шт.</b></p><div class="bar"><i style="width:${p.stock[i]*2.5}%"></i></div>`).join('')}</div></div>`}
function view_catalog(){return `<div class="toolbar"><div class="filters"><select class="select"><option>Категория</option></select><select class="select"><option>Бренд</option></select><select class="select"><option>Сезон</option></select><select class="select"><option>Коллекция</option></select></div></div><div class="card tablewrap"><table class="table"><tr><th>Ассортимент</th><th>Категория</th><th>Цвет</th><th>Размер</th><th>По складам</th><th>Остаток</th></tr>${productRows(true)}</table></div>`}
function view_income(){return `<div class="notice">Склад выбирается для всего документа. «Все склады» выбрать нельзя.</div><div class="card"><h3>Документ прихода ПР-0143</h3><div class="formgrid"><div class="field"><label>СКЛАД</label><select class="select" id="incWh">${warehouses.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>ПОСТАВЩИК</label><select class="select">${suppliers.map(x=>`<option>${x[0]}</option>`).join('')}</select></div><div class="field"><label>ДАТА</label><input class="input" type="date" value="2026-08-27"></div><div class="field"><label>ДОКУМЕНТ</label><input class="input" value="Накладная № 182"></div></div></div><div class="card mt"><h3>Позиция</h3><div class="formgrid"><div class="field span2"><label>ТОВАР</label><select class="select" id="incProduct">${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="field"><label>ЦВЕТ</label><select class="select"><option>Чёрный</option><option>Синий</option></select></div><div class="field"><label>РАЗМЕР</label><select class="select">${sizes.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>КИЗ / ШТРИХКОД</label><input class="input" placeholder="Отсканируйте код"></div><div class="field"><label>КОЛИЧЕСТВО</label><input class="input" id="incQty" type="number" value="10"></div><div class="field"><label>ЦЕНА</label><input class="input" value="4500"></div><div class="field"><label>СУММА</label><input class="input" value="45 000 ₽" readonly></div></div><div class="actions mt"><button class="btn" onclick="postIncome()">Провести приход</button><button class="btn secondary">Сохранить черновик</button></div></div>`}function postIncome(){let p=products.find(x=>x.id==incProduct.value),i=warehouses.indexOf(incWh.value),q=+incQty.value;if(q>0){p.stock[i]+=q;toast('Приход проведён: +'+q+' шт.')}}
function view_expense(){return `<div class="notice">Склад выбирается у каждой позиции. Списать больше доступного остатка нельзя.</div><div class="card"><h3>Документ расхода РС-0319</h3><div class="tablewrap"><table class="table"><tr><th>Склад</th><th>Товар</th><th>Цвет</th><th>Размер</th><th>Доступно</th><th>Списать</th></tr>${products.slice(0,3).map((p,n)=>`<tr><td><select class="select" id="exw${n}" onchange="expenseAvailable(${n},${p.id})">${warehouses.map(x=>`<option>${x}</option>`).join('')}</select></td><td>${p.name}</td><td>${p.color}</td><td>${p.size}</td><td id="avail${n}">${p.stock[0]}</td><td><input class="input" id="exq${n}" type="number" value="${n+1}" style="width:90px;min-width:0"></td></tr>`).join('')}</table></div><button class="btn mt" onclick="postExpense()">Провести расход</button></div>`}function expenseAvailable(n,id){let p=products.find(x=>x.id===id),i=warehouses.indexOf(document.getElementById('exw'+n).value);document.getElementById('avail'+n).textContent=p.stock[i]}function postExpense(){let ok=true;products.slice(0,3).forEach((p,n)=>{let i=warehouses.indexOf(document.getElementById('exw'+n).value),q=+document.getElementById('exq'+n).value;if(q>p.stock[i])ok=false});if(!ok)return toast('Ошибка: превышен доступный остаток');products.slice(0,3).forEach((p,n)=>p.stock[warehouses.indexOf(document.getElementById('exw'+n).value)]-=+document.getElementById('exq'+n).value);toast('Расход проведён')}
function view_orders(){return `<div class="toolbar"><div class="tabs"><button class="active">Все</button><button>Черновики</button><button>В производстве</button><button>Отгружены</button></div><button class="btn" onclick="toast('Создан черновик заказа')">+ Новый заказ</button></div><div class="card tablewrap"><table class="table"><tr><th>№</th><th>Производитель</th><th>Дата</th><th>Поставка</th><th>Сумма</th><th>Ответственный</th><th>Статус</th></tr>${orders.map((o,i)=>`<tr><td><button class="link" onclick="openOrder(${i})">${o[0]}</button></td><td>${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td><td>${o[4]}</td><td>Павел</td><td><span class="badge ${i===0?'warn':'blue'}">${o[5]}</span></td></tr>`).join('')}</table></div>`}function openOrder(i){window.selectedOrder=i;render('orderCard')}function view_orderCard(){let o=orders[window.selectedOrder||0];return `<button class="btn secondary" onclick="render('orders')">← К заказам</button><div class="card mt"><div class="sectionhead"><div><span class="badge warn">${o[5]}</span><h2>${o[0]} · ${o[1]}</h2><div class="muted">Договор №18/26 · ${o[2]} · поставка ${o[3]} · ответственный Павел</div></div><b style="font-size:24px">${o[4]}</b></div><div class="progress">${['Черновик','Отправлен','Подтверждён','В производстве','Отгружен','Получен'].map((x,i)=>`<div class="step ${i<4?'done':''}">${x}</div>`).join('')}</div></div><div class="grid split2 mt"><div class="card"><h3>Позиции заказа</h3><table class="table"><tr><th>Товар</th><th>Цвет</th><th>Размер</th><th>Кол-во</th><th>Цена</th></tr>${['M – 48','L – 50','XL – 52'].map((s,i)=>`<tr><td>Куртка игровая Pro</td><td>Чёрный</td><td>${s}</td><td>${50+i*20}</td><td>4 500 ₽</td></tr>`).join('')}</table></div><div class="card"><h3>Условия</h3><p>Оплата <b style="float:right">50% / 50%</b></p><p>Срок производства <b style="float:right">30 дней</b></p><p>Доставка <b style="float:right">Транспортная компания</b></p><p>Контакт <b style="float:right">Алексей Морозов</b></p><p class="muted">Документы · История · Комментарии</p></div></div>`}
function view_suppliers(){return `<div class="toolbar"><input class="input" placeholder="Поиск поставщика"><button class="btn" onclick="toast('Форма поставщика подготовлена')">+ Добавить</button></div><div class="card tablewrap"><table class="table"><tr><th>Название</th><th>Тип</th><th>Контакт</th><th>Заказы</th><th>Сумма</th><th>Срок</th><th>Долг</th></tr>${suppliers.map((s,i)=>`<tr><td><b>${s[0]}</b><br><span class="muted">ИНН/КПП · договоры · документы</span></td><td>${s[1]}</td><td>+7 900 123-4${i}56<br>manager@factory.ru</td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td><td>${i===1?'84 000 ₽':'0 ₽'}</td></tr>`).join('')}</table></div>`}
function reportFilters(){return `<div class="toolbar"><div class="tabs"><button class="active">Сегодня</button><button>Неделя</button><button>Месяц</button><button>Квартал</button><button>Год</button><button>Период</button></div><button class="btn secondary" onclick="toast('Отчёт подготовлен к экспорту в Excel')">Экспорт в Excel</button></div>`}function view_reports(){return `${reportFilters()}<div class="grid kpis">${card('Приход за период','418 шт.','1 386 000 ₽')}${card('Расход за период','264 шт.','1 942 000 ₽')}${card('Средний чек','7 356 ₽','36 продаж')}${card('Возвраты','4 шт.','1,5%')}</div><div class="grid split2"><div class="card"><h3>Остатки по складам</h3><div class="chart"><span data-v="108" style="height:82%"></span><span data-v="103" style="height:78%"></span><span data-v="50" style="height:38%"></span></div></div><div class="card"><h3>Выручка</h3><div class="chart">${[40,58,47,72,65,88,76,94].map(n=>`<span data-v="${n}к" style="height:${n}%"></span>`).join('')}</div></div></div><div class="card mt"><h3>Остатки по размерам и цветам</h3><table class="table"><tr><th>Цвет</th>${sizes.map(x=>`<th>${x}</th>`).join('')}<th>Всего</th></tr><tr><td>Чёрный</td><td>18</td><td>53</td><td>77</td><td>22</td><td><b>170</b></td></tr><tr><td>Синий</td><td>12</td><td>15</td><td>28</td><td>10</td><td><b>65</b></td></tr></table></div>`}
function view_analytics(){return `<div class="grid kpis">${card('Выручка','1,94 млн ₽','+12,8%')}${card('Маржинальность','42,6%','+2,1 п.п.')}${card('Средний чек','7 356 ₽','+4,2%')}${card('Запас товара','38 дней','при текущих продажах')}</div><div class="grid split"><div class="card"><h3>Динамика продаж</h3><div class="chart">${[32,46,41,65,54,78,72,86,68,92].map(n=>`<span data-v="${n}" style="height:${n}%"></span>`).join('')}</div></div><div class="card"><h3>Популярные параметры</h3><p>M – 48 <b style="float:right">38%</b></p><div class="bar"><i style="width:38%"></i></div><p>Чёрный <b style="float:right">44%</b></p><div class="bar"><i style="width:44%"></i></div><p>L – 50 <b style="float:right">31%</b></p><div class="bar"><i style="width:31%"></i></div></div></div><div class="card mt"><div class="sectionhead"><h3>Рекомендуется заказать</h3><span class="badge warn">по скорости продаж</span></div><table class="table"><tr><th>Товар</th><th>Цвет</th><th>Размер</th><th>Остаток</th><th>Продажи/мес.</th><th>Рекомендация</th></tr><tr><td>Куртка игровая Pro</td><td>Чёрный</td><td>M – 48</td><td>53</td><td>92</td><td><b>Заказать 120 шт.</b></td></tr><tr><td>Брюки тренировочные</td><td>Чёрный</td><td>XL – 52</td><td>16</td><td>38</td><td><b>Заказать 60 шт.</b></td></tr></table></div>`}
function view_users(){let r=[['Павел','Администратор','Все склады','Полный доступ'],['Анна','Менеджер','Стиль игры, Марбакс','Просмотр · Создание · Редактирование'],['Игорь','Кладовщик','Лига Легкого Волейбола','Просмотр · Создание'],['Мария','Бухгалтер','Все склады','Просмотр отчётов']];return `<div class="toolbar"><div class="tabs"><button class="active">Сотрудники</button><button>Роли</button><button>Матрица прав</button></div><button class="btn">+ Добавить пользователя</button></div><div class="card tablewrap"><table class="table"><tr><th>Пользователь</th><th>Роль</th><th>Склады</th><th>Разрешения</th><th>Статус</th></tr>${r.map(x=>`<tr><td><b>${x[0]}</b></td><td><span class="badge blue">${x[1]}</span></td><td>${x[2]}</td><td>${x[3]}</td><td><span class="badge">Активен</span></td></tr>`).join('')}</table></div>`}
function view_settings(){return `<div class="grid split2"><div class="card"><h3>Склады</h3>${warehouses.map((w,i)=>`<p><span class="badge">${i+1}</span> <b>${w}</b><button class="link" style="float:right">Изменить</button></p>`).join('')}</div><div class="card"><h3>Размерные соответствия</h3>${sizes.map(s=>`<p><span class="badge gray">${s}</span><span class="muted" style="float:right">один остаток</span></p>`).join('')}</div><div class="card"><h3>Категории</h3><p>Куртки · Толстовки · Футболки</p><p>Брюки · Шорты · Аксессуары</p><button class="btn ghost">Настроить</button></div><div class="card"><h3>Цвета, единицы и цены</h3><p>Единица <b style="float:right">шт.</b></p><p>Валюта <b style="float:right">₽ — российский рубль</b></p></div><div class="card"><h3>Минимальные остатки</h3><p class="muted">Предупреждать о низком остатке.</p><label><input type="checkbox" checked> Уведомления включены</label></div><div class="card"><h3>Нумерация документов</h3><p>Приход <b style="float:right">ПР-####</b></p><p>Расход <b style="float:right">РС-####</b></p><p>Заказ <b style="float:right">ЗП-####</b></p></div></div>`}
function toggleMenu(o){side.classList.toggle('open',o);shade.classList.toggle('show',o)}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));render();
</script></body></html>
