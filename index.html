async function loadData(){const [wres,pres,sres,ores,setres]=await Promise.all([db.from('warehouses').select('*').eq('active',true).order('created_at'),db.from('products').select('*,product_variants(*,stocks(quantity,warehouse_id))').order('created_at'),db.from('suppliers').select('*').order('created_at'),db.from('manufacturer_orders').select('*,suppliers(name)').order('created_at',{ascending:false}),db.from('app_settings').select('*').eq('id',1).maybeSingle()]);if(wres.error)return toast(wres.error.message);if(setres.data){appSettings=setres.data;sizes.splice(0,sizes.length,...appSettings.sizes)}dbWarehouses=wres.data;warehouses.splice(0,warehouses.length,...dbWarehouses.map(w=>w.name));let loaded=[];(pres.data||[]).forEach(p=>(p.product_variants||[]).forEach(v=>loaded.push({id:p.id,variantId:v.id,name:p.name,sku:p.sku,category:p.category,brand:p.brand,color:v.color,size:v.size,price:Number(p.price),min:p.min_stock,stock:dbWarehouses.map(w=>{let s=(v.stocks||[]).find(x=>x.warehouse_id===w.id);return s?s.quantity:0})})));if(loaded.length)products=loaded;if(sres.data?.length)suppliers.splice(0,suppliers.length,...sres.data.map(s=>[s.name,s.type,'—','—','—',s.id]));if(ores.data?.length)orders.splice(0,orders.length,...ores.data.map(o=>[o.number,o.suppliers?.name||'—',o.order_date,o.planned_delivery||'—','—',o.status,o.id]))}

function incomeDocumentCard(){let d=incomeDocuments.find(x=>String(x.id)===String(selectedIncomeDocument));if(!d)return '';let lines=incomeDbLines.filter(x=>String(x.document_id)===String(d.id)),w=dbWarehouses.find(x=>x.id===d.warehouse_id)?.name||'—',sum=lines.reduce((a,x)=>a+(+x.quantity||0)*(+x.price||0),0);return `<div class="card mt"><div class="sectionhead"><div><span class="badge">Проведён</span><h3>${escapeHtml(d.number||'Документ прихода')}</h3><div class="muted">${escapeHtml(w)} · ${d.created_at?new Date(d.created_at).toLocaleString('ru-RU'):'—'}</div></div><button class="btn secondary" onclick="selectedIncomeDocument='';render('income')">Закрыть</button></div><div class="tablewrap"><table class="table"><tr><th>Товар</th><th>Цвет</th><th>Размер</th><th>Количество</th><th>Цена закупки</th><th>Сумма</th></tr>${lines.map(x=>{let p=products.find(v=>String(v.variantId)===String(x.variant_id));return `<tr><td><b>${escapeHtml(p?.name||'Товар')}</b></td><td>${escapeHtml(p?.color||'—')}</td><td>${escapeHtml(p?.size||'—')}</td><td>${x.quantity} шт.</td><td>${money(+x.price||0)}</td><td><b>${money((+x.quantity||0)*(+x.price||0))}</b></td></tr>`}).join('')}</table></div><p style="text-align:right;font-size:18px">Итого: <b>${money(sum)}</b></p></div>`}

ption value="${g.id}">${escapeHtml(g.name)}</option>`).join('')}</select></div><div class="field"><label>ЦВЕТ</label><select class="select" id="incColor" onchange="incomeColorChanged()">${colors.map(x=>`<option>${escapeHtml(x)}</option>`).join('')}</select></div><div class="field"><label>РАЗМЕР</label><select class="select" id="incSize">${sizesForColor.map(v=>`<option value="${v.variantId}">${escapeHtml(v.size)}</option>`).join('')}</select></div><div class="field"><label>КОЛ-ВО</label><input class="input" id="incQty" type="number" min="1" value="1" oninput="incomeUpdateSum()"></div><div class="field"><label>ЦЕНА ЗАКУПКИ</label><input class="input" id="incPrice" value="${first?.purchasePrice||0}" readonly></div><div class="field"><label>СУММА</label><input class="input" id="incSum" value="${money(first?.purchasePrice||0)}" readonly></div><button class="btn" onclick="addIncomeLine()">+ Добавить</button></div>`:'<p class="muted">Для выбранного склада товары не найдены.</p>'}</div><div class="card mt"><div class="sectionhead"><h3>Позиции документа</h3><span class="label">${incomeDraftLines.length} поз.</span></div><div class="tablewrap"><table class="table"><tr><th>№</th><th>Товар</th><th>Цвет</th><th>Размер</th><th>Количество</th><th>Цена закупки</th><th>Сумма</th></tr>${incomeDraftRows()}</table></div><div class="incomeSummary"><span>Итого: <b>${money(draftTotal)}</b></span><button class="btn secondary" onclick="clearIncomeDraft()">Очистить</button><button class="btn" onclick="postIncome()" ${incomeDraftLines.length?'':'disabled'}>Провести приход</button></div></div><div class="card mt"><h3>Сформированные документы</h3><div class="tablewrap"><table class="table"><tr><th>Номер</th><th>Дата</th><th>Склад</th><th>Позиций</th><th>Сумма</th><th></th></tr>${incomeDocumentRows()}</table></div></div>${incomeDocumentCard()}`}
postIncome=async function(){if(!incomeDraftLines.length)return toast('Добавьте позиции в документ');let wi=warehouses.indexOf(incomeWarehouse),warehouse=dbWarehouses[wi];if(!warehouse)return toast('Выберите склад');let number='ПР-'+Date.now().toString().slice(-8),created=await db.from('stock_documents').insert({number,document_type:'income',warehouse_id:warehouse.id}).select().single();if(created.error)return toast(created.error.message);let lines=incomeDraftLines.map(x=>({document_id:created.data.id,variant_id:x.variantId,warehouse_id:warehouse.id,quantity:x.quantity,price:x.price})),saved=await db.from('stock_lines').insert(lines);if(saved.error)return toast(saved.error.message);incomeDraftLines=[];selectedIncomeDocument=created.data.id;await loadData();render('income');toast('Приход проведён: '+number)};
const incomeBaseLoadData=loadData;loadData=async function(){await incomeBaseLoadData();await loadIncomeDocuments()};
let expenseWarehouse='',expenseDraftLines=[];
function expenseGroups(){let wi=warehouses.indexOf(expenseWarehouse||warehouses[0]);return productGroups().filter(g=>(g.stock[wi]||0)>0).sort((a,b)=>a.name.localeCompare(b.name,'ru'))}
function expenseVariants(productId){let wi=warehouses.indexOf(expenseWarehouse);return products.filter(p=>String(p.id)===String(productId)&&(p.stock[wi]||0)>0).sort((a,b)=>a.color.localeCompare(b.color,'ru')||sizeRank(a.size)-sizeRank(b.size))}
function expenseProductChanged(){let productId=document.getElementById('expenseProduct')?.value,variants=expenseVariants(productId),colors=[...new Set(variants.map(v=>v.color))],color=document.getElementById('expenseColor');if(!color)return;color.innerHTML=colors.map(x=>`<option>${escapeHtml(x)}</option>`).join('');expenseColorChanged()}
function expenseColorChanged(){let productId=document.getElementById('expenseProduct')?.value,color=document.getElementById('expenseColor')?.value,variants=expenseVariants(productId).filter(v=>v.color===color),size=document.getElementById('expenseSize');if(size)size.innerHTML=variants.map(v=>`<option value="${escapeHtml(v.variantId)}">${escapeHtml(v.size)}</option>`).join('');expenseVariantChanged()}
function expenseVariantChanged(){let variantId=document.getElementById('expenseSize')?.value,p=products.find(x=>String(x.variantId)===String(variantId)),wi=warehouses.indexOf(expenseWarehouse),already=expenseDraftLines.filter(x=>String(x.variantId)===String(variantId)&&x.warehouse===expenseWarehouse).reduce((a,x)=>a+x.quantity,0),available=Math.max(0,(p?.stock[wi]||0)-already),e=document.getElementById('expenseAvailable');if(e)e.value=available+' шт.';let q=document.getElementById('expenseQty');if(q)q.max=available;expenseTypeChanged()}
function expenseTypeChanged(){let type=document.getElementById('expenseType')?.value||'Продажа',variantId=document.getElementById('expenseSize')?.value,p=products.find(x=>String(x.variantId)===String(variantId)),price=document.getElementById('expensePrice');if(!price)return;if(type==='Продажа'){price.value=p?.price||0;price.readOnly=true}else if(type==='Подарок'){price.value=0;price.readOnly=true}else{price.readOnly=false;if(price.value===(String(p?.price||0))||!price.value)price.value=''}}

function addExpenseLine(){let variantId=document.getElementById('expenseSize')?.value,p=products.find(x=>String(x.variantId)===String(variantId)),wi=warehouses.indexOf(expenseWarehouse),q=+document.getElementById('expenseQty')?.value||0,type=document.getElementById('expenseType')?.value||'Продажа',price=+document.getElementById('expensePrice')?.value||0;if(!p)return toast('Выберите товар, цвет и размер');if(type==='Спецтариф'&&price<=0)return toast('Укажите цену спецтарифа');let already=expenseDraftLines.filter(x=>String(x.variantId)===String(variantId)&&x.warehouse===expenseWarehouse).reduce((a,x)=>a+x.quantity,0),available=(p.stock[wi]||0)-already;if(q<=0)return toast('Укажите количество больше нуля');if(q>available)return toast('Недостаточно остатка. Доступно: '+available+' шт.');let existing=expenseDraftLines.find(x=>String(x.variantId)===String(p.variantId)&&x.warehouse===expenseWarehouse&&x.type===type&&x.price===price);if(existing)existing.quantity+=q;else expenseDraftLines.push({variantId:p.variantId,name:p.name,color:p.color,size:p.size,warehouse:expenseWarehouse,warehouseId:dbWarehouses[wi].id,quantity:q,type,price});render('expense');toast('Позиция добавлена в расход')}
function removeExpenseLine(index){expenseDraftLines.splice(index,1);render('expense')}
function clearExpenseDraft(){expenseDraftLines=[];render('expense')}

">${escapeHtml(v.size)}</option>`).join('')}</select></div><div class="field"><label>ДОСТУПНО</label><input class="input" id="expenseAvailable" value="${firstAvailable} шт." readonly></div><div class="field"><label>СПИСАТЬ</label><input class="input" id="expenseQty" type="number" min="1" max="${firstAvailable}" value="1"></div><button class="btn" onclick="addExpenseLine()">+ Добавить</button></div>`:`<div><div class="field" style="max-width:320px"><label>СКЛАД</label><select class="select" onchange="setExpenseWarehouse(this.value)">${warehouses.map(x=>`<option ${x===expenseWarehouse?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div><p class="muted">На выбранном складе нет товаров с доступным остатком.</p></div>`}</div><div class="card mt"><div class="sectionhead"><h3>Позиции документа</h3><span class="label">${expenseDraftLines.length} поз.</span></div><div class="tablewrap"><table class="table"><tr><th>№</th><th>Склад</th><th>Товар</th><th>Цвет</th><th>Размер</th><th>Количество</th><th>Цена</th><th></th></tr>${expenseDraftRows()}</table></div><div class="expenseActions"><button class="btn secondary" onclick="clearExpenseDraft()">Очистить</button><button class="btn" onclick="postExpense()" ${expenseDraftLines.length?'':'disabled'}>Провести расход</button></div></div>`}
const expenseViewWithoutTypes=view_expense;view_expense=function(){let html=expenseViewWithoutTypes(),group=expenseGroups()[0],variant=group?expenseVariants(group.id)[0]:null,typeAndPrice=`<div class="field"><label>ТИП РАСХОДА</label><select class="select" id="expenseType" onchange="expenseTypeChanged()"><option>Продажа</option><option>Спецтариф</option><option>Подарок</option></select></div><div class="field"><label>ЦЕНА ЗА ЕД.</label><input class="input" id="expensePrice" type="number" min="0" value="${variant?.price||0}" readonly></div>`;return html.replace('grid-template-columns:minmax(150px,1fr) minmax(220px,2fr) minmax(130px,1fr) minmax(130px,1fr) 110px 100px auto','grid-template-columns:minmax(145px,1fr) minmax(200px,2fr) minmax(120px,1fr) minmax(120px,1fr) minmax(135px,1fr) 120px 100px 90px auto').replace('<div class="field"><label>ДОСТУПНО</label>',typeAndPrice+'<div class="field"><label>ДОСТУПНО</label>').replace('<th>Количество</th><th>Цена</th><th></th>','<th>Тип расхода</th><th>Количество</th><th>Цена за ед.</th><th>Сумма</th><th></th>')}
postExpense=async function(){if(!expenseDraftLines.length)return toast('Добавьте позиции в документ');for(let x of expenseDraftLines){let p=products.find(v=>String(v.variantId)===String(x.variantId)),wi=dbWarehouses.findIndex(w=>w.id===x.warehouseId);if(!p||x.quantity>(p.stock[wi]||0))return toast('Недостаточно остатка: '+x.name)}let number='РС-'+Date.now().toString().slice(-8),created=await db.from('stock_documents').insert({number,document_type:'expense'}).select().single();if(created.error)return toast(created.error.message);let lines=expenseDraftLines.map(x=>({document_id:created.data.id,variant_id:x.variantId,warehouse_id:x.warehouseId,quantity:x.quantity,price:x.price})),saved=await db.from('stock_lines').insert(lines);if(saved.error)return toast(saved.error.message);expenseDraftLines=[];await loadData();render('expense');toast('Расход проведён: '+number)};
